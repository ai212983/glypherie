lefthook: npx --no-install lefthook
glob_matcher: doublestar

pre-commit:
  parallel: true
  jobs:
    - name: formatting
      glob: "**/*.{md,json,jsonc}"
      exclude:
        - "docs/references/VisualTrueType/**"
        - "docs/references/specs/**"
        - "**/vendor/**"
        - "**/package-lock.json"
        - "**/.mise/**"
        - "**/node_modules/**"
        - "**/target/**"
        - "**/out/**"
        - "**/.venv/**"
      run: npx --no-install dprint check {staged_files}
    - name: spelling
      glob:
        - "README.md"
        - "AGENTS.md"
        - "fonts/**/*.md"
        - "docs/**/*.md"
        - "apps/**/*.md"
        - "crates/**/*.md"
        - "experiments/**/*.md"
      exclude:
        - "docs/references/VisualTrueType/**"
        - "docs/references/specs/**"
        - "docs/references/papers/*/paper.md"
        - "**/vendor/**"
        - "**/node_modules/**"
        - "**/target/**"
        - "**/out/**"
        - "**/.venv/**"
      run: npx --no-install cspell --no-progress --gitignore --no-must-find-files {staged_files}
    - name: rust-formatting
      glob:
        - "crates/generator/**/*.rs"
        - "crates/generator/Cargo.toml"
      exclude: "crates/generator/vendor/**"
      run: cargo fmt --manifest-path crates/generator/Cargo.toml --check

commit-msg:
  jobs:
    - name: conventional-commit
      run: node node_modules/@commitlint/cli/cli.js --edit "{1}"
