lefthook: npx --no-install lefthook
glob_matcher: doublestar

pre-commit:
  parallel: true
  jobs:
    - name: formatting
      glob:
        - "**/*.{md,json,jsonc}"
        - "**/*.{ts,tsx,js,mjs,cjs}"
      exclude:
        - "docs/references/VisualTrueType/**"
        - "docs/references/specs/**"
        - "**/vendor/**"
        - "**/package-lock.json"
        - "**/.mise/**"
        - "**/node_modules/**"
        - "**/target/**"
        - "**/out/**"
        - "**/.venv/**"
      run: npm run fmt:check -- {staged_files}
    - name: spelling
      glob:
        - "README.md"
        - "AGENTS.md"
        - "fonts/**/*.md"
        - "docs/**/*.md"
        - "apps/**/*.md"
        - "crates/**/*.md"
        - "experiments/**/*.md"
      exclude:
        - "docs/references/VisualTrueType/**"
        - "docs/references/specs/**"
        - "docs/references/papers/*/paper.md"
        - "**/vendor/**"
        - "**/node_modules/**"
        - "**/target/**"
        - "**/out/**"
        - "**/.venv/**"
      run: npm run spell:check -- {staged_files}
    - name: rust-formatting
      glob:
        - "crates/generator/**/*.rs"
        - "crates/generator/Cargo.toml"
      exclude: "crates/generator/vendor/**"
      run: cargo fmt --manifest-path crates/generator/Cargo.toml --check
    - name: typescript-linting
      glob:
        - "apps/web/**/*.ts"
        - "apps/web/**/*.tsx"
      exclude:
        - "**/node_modules/**"
        - "**/target/**"
        - "**/out/**"
      run: npm --prefix apps/web run lint

commit-msg:
  jobs:
    - name: conventional-commit
      run: npm run commitlint -- --edit "{1}"
