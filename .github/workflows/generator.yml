name: generator
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  generator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: dtolnay/rust-toolchain@stable
      - name: Rust generator and compatibility tests
        run: cargo test --locked --manifest-path tools/generator/Cargo.toml

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: npm ci --ignore-scripts
      - name: Root TypeScript typecheck
        run: npm run typecheck
      - name: Formatting and documentation spelling
        run: |
          npm run fmt:check
          npm run spell:check
          cargo fmt --manifest-path tools/generator/Cargo.toml --check
      - name: Hook behavior tests
        run: npm test

  commits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: npm ci --ignore-scripts
      - name: Validate new commit messages
        run: node tools/hooks/check-commits.ts
