<!doctype html>
<meta charset="utf-8">
<title>Internal joint fitting check</title>
<style>
  body { font: 14px system-ui; margin: 24px; color: #222; }
  section { margin: 18px 0; border: 1px solid #ddd; padding: 12px; }
  .arms { display: flex; gap: 32px; align-items: start; flex-wrap: wrap; }
  canvas { image-rendering: pixelated; display: block; margin: 6px 0; }
  svg { width: 240px; height: 220px; border: 1px solid #ddd; }
  pre { white-space: pre-wrap; font-size: 12px; }
</style>
<h1>Internal joint fitting check</h1>
<p id="scope"></p>
<label>Glyph <select id="glyph"></select></label>
<div id="spot"></div>
<div id="lines"></div>
<script>
function bitmap(parent, pixels, frame, zoom, label) {
  const wrap = document.createElement('div');
  wrap.textContent = label;
  const c = document.createElement('canvas');
  c.width = frame.width; c.height = frame.height;
  c.style.width = `${c.width * zoom}px`; c.style.height = `${c.height * zoom}px`;
  const ctx = c.getContext('2d'); ctx.fillStyle = 'white'; ctx.fillRect(0, 0, c.width, c.height);
  ctx.fillStyle = '#111';
  pixels.forEach((v, i) => { if (v) ctx.fillRect(i % c.width, Math.floor(i / c.width), 1, 1); });
  wrap.append(c); parent.append(wrap);
}
function framed(g) {
  const left = Math.min(g.old.left, g.new.left, 0);
  const top = Math.min(g.old.top, g.new.top, 0);
  const right = Math.max(g.old.left + g.old.width, g.new.left + g.new.width, 0);
  const bottom = Math.max(g.old.top + g.old.height, g.new.top + g.new.height, 0);
  const frame = { width: right-left, height: bottom-top };
  return [frame, ...[g.old, g.new].map(tile => {
    const pixels = Array(frame.width * frame.height).fill(0);
    tile.pixels.forEach((v,i) => {
      if(v) pixels[(tile.top-top+Math.floor(i/tile.width))*frame.width+tile.left-left+i%tile.width]=1;
    }); return pixels;
  })];
}
function path(cmds) {
  return cmds.map(c => ({move_to:()=>`M${c.x},${-c.y}`,line_to:()=>`L${c.x},${-c.y}`,
    quad_to:()=>`Q${c.x1},${-c.y1} ${c.x},${-c.y}`,
    curve_to:()=>`C${c.x1},${-c.y1} ${c.x2},${-c.y2} ${c.x},${-c.y}`,close:()=>`Z`}[c.op]())).join(' ');
}
function show(data) {
  const g = data.glyphs.find(g => g.codepoint == document.querySelector('#glyph').value);
  const spot = document.querySelector('#spot'); spot.replaceChildren();
  const section = document.createElement('section');
  const status = document.createElement('p');
  status.textContent = `${g.char}: ${g.result.reason}; applied ${g.result.applied}; delivered bitmap changed ${g.changed}`;
  section.append(status);
  const arms = document.createElement('div'); arms.className = 'arms';
  const [frame, old, candidate] = framed(g);
  for (const zoom of [1, 12]) {
    bitmap(arms, old, frame, zoom, `Current ${zoom}×`);
    bitmap(arms, candidate, frame, zoom, `Experiment ${zoom}×`);
  }
  section.append(arms);
  const svg = document.createElementNS('http://www.w3.org/2000/svg','svg');
  svg.setAttribute('viewBox', `-1 ${-data.size-1} ${data.size+2} ${data.size+2}`);
  for (const [commands, color] of [[g.source,'#aaa'],[g.preferred_commands,'#19833c'],[g.commands,'#d33228']]) {
    const p = document.createElementNS(svg.namespaceURI,'path');
    p.setAttribute('d',path(commands)); p.setAttribute('fill','none');
    p.setAttribute('stroke',color); p.setAttribute('stroke-width','.035'); svg.append(p);
  }
  section.append(svg);
  const pre = document.createElement('pre'); pre.textContent = JSON.stringify(g.result,null,2);
  const details = document.createElement('details');
  const summary = document.createElement('summary'); summary.textContent = 'Geometry diagnostics'; details.append(summary);
  details.append(pre); section.append(details); spot.append(section);
}
fetch('data.json').then(r=>r.json()).then(data=>{
  document.querySelector('#scope').textContent = `${data.family} ${data.weight} / ${data.size}px; ${data.hint}; ${data.model}. Internal diagnostic: only listed glyphs are fitted. Other text glyphs retain the current packet. Green: current outline, red: experiment, gray: source.`;
  const select=document.querySelector('#glyph');
  data.glyphs.forEach(g=>{const o=document.createElement('option');o.value=g.codepoint;o.textContent=g.char;select.append(o);});
  const focus=data.model==='diagonal'?120:115;
  if(data.glyphs.some(g=>g.codepoint===focus)) select.value=focus;
  select.addEventListener('change',()=>show(data)); show(data);
  data.lines.forEach(line=>{
    const s=document.createElement('section'); const p=document.createElement('p');p.textContent=line.text;s.append(p);
    const a=document.createElement('div');a.className='arms';
    bitmap(a,line.upstream.pixels,line.frame,1,'Current 1×');
    bitmap(a,line.width_only.pixels,line.frame,1,'Experiment 1×');s.append(a);document.querySelector('#lines').append(s);
  });
});
</script>
