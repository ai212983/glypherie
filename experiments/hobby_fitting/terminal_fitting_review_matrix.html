<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Terminal reference-height comparison</title>
<style>
body{font:14px system-ui;color:#222;background:white;margin:24px}h1{font-size:23px}
.controls{display:flex;gap:20px;flex-wrap:wrap;position:sticky;top:0;background:white;padding:12px 0;z-index:1}
select{font:inherit;margin-left:8px}iframe{width:100%;height:2100px;border:0}#error{color:#a00}
</style>
<h1>Terminal reference-height comparison</h1>
<p>Previous crossing candidate compared with constrained terminal fitting. Source stroke contrast and terminal reference heights remain part of the design. Inspect diagonal weight, terminals, crossing shape and ordinary text. The maintained app is separate.</p>
<div class="controls">
<label>Font<select id="family"><option>SourceSans3</option><option>Roboto</option></select></label>
<label>Size<select id="size"><option>12</option><option>14</option><option selected>16</option><option>18</option><option>20</option><option>24</option></select></label>
<label>Weight<select id="weight"><option>300</option><option selected>400</option><option>700</option></select></label>
<label>Font hints<select id="hint"><option value="selective_default">On</option><option value="auto_default">Off</option></select></label>
</div>
<p id="scope"></p><p id="error" role="alert"></p><iframe id="case" title="Selected fitting comparison"></iframe>
<script>
const fields=['family','size','weight','hint'],query=new URLSearchParams(location.search);
for(const key of fields){const select=document.getElementById(key);if([...select.options].some(o=>o.value===query.get(key)))select.value=query.get(key);}
fetch('matrix.json').then(r=>{if(!r.ok)throw Error('Matrix unavailable');return r.json();}).then(cells=>{
 function show(){const selected=Object.fromEntries(fields.map(k=>[k,document.getElementById(k).value]));
 history.replaceState(null,'',`?${new URLSearchParams(selected)}`);
 const cell=cells.find(c=>fields.every(k=>String(c[k])===selected[k]));
 if(!cell){document.getElementById('error').textContent='Selected case unavailable';return;}
 document.getElementById('scope').textContent=`${cell.counts.probed} glyphs evaluated; ${cell.counts.applied} geometric fits; ${cell.counts.changed} changed bitmaps. Changes require optical assessment.`;
 document.getElementById('case').src=`${cell.directory}/index.html`;
 }fields.forEach(k=>document.getElementById(k).addEventListener('change',show));show();
}).catch(error=>document.getElementById('error').textContent=error.message);
</script>
