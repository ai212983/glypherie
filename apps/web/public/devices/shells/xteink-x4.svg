<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 697 1140" role="img" aria-labelledby="x4-title">
  <title id="x4-title">Xteink X4 enclosure outline</title>
  <!-- Original vector shell: original X4 pocket reader (114 x 69 mm slab,
       official front render proportions). Black body, flush bottom rocker
       pair in a recessed tray, short upper plus long lower key on the right
       edge, shallow groove low on the left edge. No front branding. -->
  <defs>
    <linearGradient id="x4-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2b30"/>
      <stop offset="0.12" stop-color="#232327"/>
      <stop offset="1" stop-color="#17171a"/>
    </linearGradient>
    <linearGradient id="x4-key" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#35353b"/>
      <stop offset="0.5" stop-color="#26262b"/>
      <stop offset="1" stop-color="#1b1b1f"/>
    </linearGradient>
  </defs>
  <path fill="url(#x4-body)" fill-rule="evenodd" d="M40,0 H690 V1140 H40 Q0,1140 0,1100 V40 Q0,0 40,0 Z M83.6,61.9 H606.4 Q617.4,61.9 617.4,72.9 V959 Q617.4,969.9 606.4,969.9 H83.6 Q72.6,969.9 72.6,959 V72.9 Q72.6,61.9 83.6,61.9 Z"/>
  <rect x="69.6" y="58.9" width="550.8" height="914" rx="13" fill="none" stroke="#0a0a0c" stroke-width="6"/>
