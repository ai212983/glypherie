    <rect x="349.4" y="1099.6" width="213.5" height="30.4" rx="15.2" fill="url(#x4-key)" stroke="#45454e" stroke-width="1.6"/>
    <rect x="127" y="1101.6" width="196.9" height="2.2" rx="1.1" fill="#4a4a53" opacity="0.7"/>
    <rect x="357.4" y="1101.6" width="197.5" height="2.2" rx="1.1" fill="#4a4a53" opacity="0.7"/>
  </g>
  <rect x="683" y="192.7" width="14" height="95.4" rx="5" fill="url(#x4-key)" stroke="#45454e" stroke-width="1.4"/>
