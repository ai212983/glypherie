<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 662 1075" role="img" aria-labelledby="picco-title">
  <title id="picco-title">BOOX Picco enclosure outline</title>
  <!-- Original vector shell: Picco card reader (62 x 105.5 mm light slab,
       official front render proportions). Screen set high with a wider lower
       chin, one nub low on the left edge, short upper plus long lower key on
       the right edge. No front branding. Side key placement photo-estimated. -->
  <defs>
    <linearGradient id="picco-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#edeff1"/>
      <stop offset="0.12" stop-color="#e2e6ea"/>
      <stop offset="1" stop-color="#d2d8de"/>
    </linearGradient>
    <linearGradient id="picco-key" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dfe4e9"/>
      <stop offset="0.5" stop-color="#ccd2d9"/>
      <stop offset="1" stop-color="#bcc3cb"/>
    </linearGradient>
  </defs>
  <path fill="url(#picco-body)" fill-rule="evenodd" d="M55,10 H605 Q640,10 640,45 V1030 Q640,1065 605,1065 H55 Q20,1065 20,1030 V45 Q20,10 55,10 Z M80.5,54.3 H579.5 Q589.5,54.3 589.5,64.3 V909.3 Q589.5,919.3 579.5,919.3 H80.5 Q70.5,919.3 70.5,909.3 V64.3 Q70.5,54.3 80.5,54.3 Z"/>
  <rect x="67.5" y="51.3" width="525" height="871" rx="12" fill="none" stroke="#a9b0b8" stroke-width="6"/>
  <rect x="10" y="777" width="10" height="51" rx="3" fill="url(#picco-key)" stroke="#a9b0b8" stroke-width="1.4"/>
  <rect x="640" y="135" width="12" height="67" rx="4" fill="url(#picco-key)" stroke="#a9b0b8" stroke-width="1.4"/>
  <rect x="640" y="290" width="12" height="197" rx="4" fill="url(#picco-key)" stroke="#a9b0b8" stroke-width="1.4"/>
</svg>
