      <stop offset="0" stop-color="#f7c948"/>
      <stop offset="0.55" stop-color="#f2c200"/>
      <stop offset="1" stop-color="#d9a900"/>
    </linearGradient>
    <linearGradient id="pd-button" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6c945"/>
      <stop offset="1" stop-color="#e3ae00"/>
    </linearGradient>
    <radialGradient id="pd-steel" cx="0.35" cy="0.3" r="1">
      <stop offset="0" stop-color="#d5d9df"/>
      <stop offset="0.6" stop-color="#9aa0a8"/>
      <stop offset="1" stop-color="#6f747c"/>
    </radialGradient>
  </defs>
