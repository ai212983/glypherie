<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 772 750" role="img" aria-labelledby="pd-title">
  <title id="pd-title">Playdate console outline</title>
  <!-- Original vector shell: Playdate console (76 x 74 mm face). Left-offset
       screen with 3 mm bezel, right column with face screw, menu key and
       speaker slot, D-pad and A/B below, docked crank hint on the right
       edge, face screws, lock tab on the top edge. -->
