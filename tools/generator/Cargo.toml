[package]
name = "font_generator"
version = "0.1.0"
edition = "2021"
default-run = "font_generator"

[features]
default = ["iteration-01"]
iteration-01 = ["dep:skrifa_iteration"]

[dependencies]
harfrust = "=0.13.3"
skrifa = "=0.46.2"
skrifa_iteration = { path = "vendor/skrifa-iteration", optional = true }
zeno = "=0.3.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
unicode-script = "0.5"
unicode-general-category = "1"
png = "=0.18.0"
tempfile = "3"

[build-dependencies]
sha2 = "0.10"

[dev-dependencies]
write-fonts = "=0.53.0"
