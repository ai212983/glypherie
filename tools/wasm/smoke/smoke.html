<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>font_wasm smoke</title>
</head>
<body>
<h1>font_wasm smoke</h1>
<!--
  Host-executed. Build first: tools/wasm/build.sh web
  Serve tools/wasm over HTTP (module + wasm loading need it), e.g.
    python3 -m http.server --directory tools/wasm 8000
  then open http://localhost:8000/smoke/smoke.html, pick a TTF/OTF, Render.
-->
<input type="file" id="font" accept=".ttf,.otf">
<button id="go" disabled>Render</button>
<canvas id="out" width="200" height="60"></canvas>
<pre id="log">loading…</pre>
<script type="module">
import init, { Font } from "../pkg-web/font_wasm.js";

const log = document.getElementById("log");
const go = document.getElementById("go");
const picker = document.getElementById("font");
const canvas = document.getElementById("out");
let bytes = null;

try {
  await init();
  log.textContent = "wasm ready; pick a font.";
} catch (e) {
  log.textContent = `init failed: ${e}`;
  throw e;
}

picker.addEventListener("change", async () => {
  const file = picker.files[0];
  bytes = file ? new Uint8Array(await file.arrayBuffer()) : null;
  go.disabled = !bytes;
});

go.addEventListener("click", () => {
  const font = new Font(bytes);
  try {
    const meta = font.metadata();
    const result = font.render({
      text: "Hello", width: canvas.width, height: canvas.height,
      size_px: 16, axes: {}, hinting: "auto", output_bits: 1,
    });
    try {
      const rgba = result.pixels();
      const image = new ImageData(
        new Uint8ClampedArray(rgba.buffer), result.width(), result.height(),
      );
      canvas.getContext("2d").putImageData(image, 0, 0);
      const layout = result.layout();
      log.textContent =
        `names: ${JSON.stringify(meta.names).slice(0, 120)}\n` +
        `canvas: ${result.width()}x${result.height()}, ` +
        `lines: ${layout.lines.length}`;
    } finally {
      result.free();
    }
  } finally {
    font.free();
  }
});
</script>
</body>
</html>
