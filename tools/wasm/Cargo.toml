[package]
name = "font_wasm"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Production must use the approved skrifa-baseline snapshot: never enable the
# generator's `candidate` feature from this crate.
font_generator = { path = "../generator", default-features = false }
wasm-bindgen = "0.2"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-wasm-bindgen = "0.6"

[dev-dependencies]
sha2 = "0.10"
