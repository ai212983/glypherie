[package]
name = "font_wasm"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# Production (default) must use the approved skrifa-baseline snapshot: never
# enable the generator's `candidate` feature from the default build. The
# opt-in `preview` feature enables it for the explicit preview artifact only
# (built via `crates/wasm/build.sh web preview` / `just wasm-build-preview`);
# a `candidate` render on a default build fails visibly instead of falling
# back to another role.
default = []
preview = ["font_generator/candidate"]

[dependencies]
font_generator = { path = "../generator", default-features = false }
wasm-bindgen = "0.2"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-wasm-bindgen = "0.6"

[dev-dependencies]
sha2 = "0.10"
